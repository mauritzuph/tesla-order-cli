name: Release

# Push a version tag to publish binaries:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the full git history, not just the latest commit

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan git history
        run: gitleaks git . --redact --verbose

      - name: Scan files
        run: gitleaks dir . --redact --verbose

  release:
    needs: secrets # a found secret stops the release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload binaries
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser builds the changelog from git history

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
